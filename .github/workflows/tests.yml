name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify test prerequisites
        run: |
          .venv/bin/python --version
          ffmpeg -version
          ffprobe -version
      - name: Run all Python tests
        run: .venv/bin/python -m unittest discover -s tests -v

  swift:
    name: Swift app tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.cache/clang
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.cache/clang
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg
        run: |
          # The engine uses filter_complex_script, removed in FFmpeg 9.
          brew install ffmpeg@8
          # Bridge fixtures use Homebrew's bin directory explicitly.
          brew link --force --overwrite ffmpeg@8
      - name: Install Python bridge dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify test prerequisites
        run: |
          .venv/bin/python --version
          ffmpeg -version
          ffprobe -version
          swift --version
      - name: Run all Swift tests
        run: swift test --disable-sandbox --package-path macOS --scratch-path .cache/swift-build -c release

  release-runtime:
    name: macOS 15 runtime (${{ matrix.runtime }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [core, gpu]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/release/requirements*.lock
      - name: Install pinned release runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r scripts/release/requirements-${{ matrix.runtime }}.lock
          .venv/bin/python -m pip install --no-deps --force-reinstall --require-hashes -r scripts/release/requirements-mlx-macos15.lock
          .venv/bin/python -m pip check
      - name: Check deployment targets and run on Sequoia
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          .venv/bin/python - <<'PY'
          import importlib
          import os
          import platform
          import site
          import subprocess
          import sys
          assert platform.mac_ver()[0].split('.')[0] == '15'
          subprocess.run([sys.executable, 'scripts/release/bundle-macos.py',
                          '--audit-only', site.getsitepackages()[0]], check=True)
          for module in ['censor.desktop', 'faster_whisper', 'mlx_whisper', 'torch', 'onnxruntime']:
              importlib.import_module(module)
          if os.environ['RUNTIME'] == 'gpu':
              for module in ['gigaam', 'parakeet_mlx', 'mlx_qwen3_asr', 'torchaudio', 'soundfile']:
                  importlib.import_module(module)
          import mlx.core as mx
          # Hosted VMs have no Metal GPU; validate loading/execution on the real OS.
          # GPU kernels and real inference are checked locally before signing.
          mx.set_default_device(mx.cpu)
          assert (mx.array([1, 2, 3]) * 2).tolist() == [2, 4, 6]
          print('Release runtime passed on macOS', platform.mac_ver()[0])
          PY
